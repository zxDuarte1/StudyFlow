<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - Login</title>
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/logo.png">


</head>
<body>
  <img src="../assets/logo.png" alt="StudyFlow Logo" class="top-logo">
  <div class="login-container">
    <h1 class="logo">Login</h1>

    <form class="login-box" id ="loginForm">

    <input type="email" name="email" placeholder="Seu e-mail" required>
    <input type="password" name="password" placeholder="Sua senha" required>

      <p class="register-text">
        Não tem conta?
        <a href="register.html">Criar agora</a>
      </p>
        <p class="register-text">
        <a href="requestReset.html">Recuperar Senha</a>
      </p>

      <button type="submit" id="loginBtn">Entrar</button>
    </form>
  </div>

 <script src="../js/login.js" defer></script>
 <script src="../js/notifications.js"></script>
</body>
</html>
