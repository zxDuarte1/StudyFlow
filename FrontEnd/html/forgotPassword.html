<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - Recuperação</title>
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/logo.png">


</head>
<body>
  <img src="../assets/logo.png" alt="StudyFlow Logo" class="top-logo">
  <div class="login-container">
    <h1 class="logo">Recuperação</h1>

    <form class="login-box" id ="passwordForm">

    <input type="password" name="password" placeholder="Digite a nova Senha" required>
    <input type="password" name="password2" placeholder="Repita a senha" required>

      <button type="submit" id="loginBtn">Confirmar</button>
    </form>
  </div>

 <script src="../js/forgotPassword.js" defer></script>
 <script src="../js/notifications.js"></script>
</body>
</html>
